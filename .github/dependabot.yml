version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # locally generated wasm package (wasm-pack output in ./pkg, not on a registry),
      # and ./pkg/package.json isn't in git so the path dep can never be fetched
      - dependency-name: chatsounds-web
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns:
          - "*"
